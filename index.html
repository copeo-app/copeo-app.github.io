<!DOCTYPE html>
<html>
  <head>
    <title>CopeoApp</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #fd4d21 0%, #ff6b47 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }

      .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      h1 {
        margin-bottom: 10px;
        font-size: 2.2em;
        font-weight: 700;
      }

      .subtitle {
        margin-bottom: 30px;
        opacity: 0.9;
        font-size: 1.1em;
      }

      .button {
        display: inline-block;
        background: white;
        color: #fd4d21;
        padding: 15px 30px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 600;
        margin: 10px;
        border: 1px solid white;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      .button:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: translateY(-2px);
      }

      .loading {
        margin: 20px 0;
      }

      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 3px solid white;
        width: 30px;
        height: 30px;
        animation: spin 2s linear infinite;
        margin: 0 auto 15px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .countdown {
        font-size: 0.9em;
        opacity: 0.8;
        margin-top: 15px;
      }

      .fallback-info {
        margin-top: 20px;
        font-size: 0.9em;
        opacity: 0.8;
      }

      .fallback-info a {
        color: white;
        text-decoration: underline;
      }

      .fallback-info a:hover {
        color: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🏠 CopeoApp</h1>
      <p class="subtitle">Redirecting to Homepage...</p>

      <div class="loading">
        <div class="spinner"></div>
        <p>Taking you to CopeoApp</p>
        <div class="countdown">
          Redirecting in <span id="countdown">3</span> seconds
        </div>
      </div>

      <button class="button" onclick="redirectNow()">🚀 Go Now</button>

      <div class="fallback-info">
        <p>
          <small
            >If you are not redirected automatically,
            <a href="https://copeoapp.com" id="fallback-link">click here</a> to
            go to CopeoApp homepage.</small
          >
        </p>
      </div>
    </div>

    <script>
      const REDIRECT_URL = "https://copeoapp.com";
      let countdown = 3;

      function updateCountdown() {
        document.getElementById("countdown").textContent = countdown;
        countdown--;

        if (countdown < 0) {
          redirect();
        }
      }

      function redirect() {
        window.location.href = REDIRECT_URL;
      }

      function redirectNow() {
        redirect();
      }

      // Start countdown
      const countdownInterval = setInterval(() => {
        if (countdown >= 0) {
          updateCountdown();
        } else {
          clearInterval(countdownInterval);
        }
      }, 1000);

      // Fallback redirect after 3 seconds
      setTimeout(redirect, 3000);
    </script>
  </body>
</html>
